<!-- Frontend/index.html -->
<!DOCTYPE html>
<html>
<head>
  <title>Jarvis Control Panel</title>
  <style>
    body { background-color: #0d0d0d; color: white; font-family: sans-serif; text-align: center; padding: 2em; }
    button { margin: 10px; padding: 15px 30px; font-size: 16px; background-color: #222; color: #0f0; border: none; border-radius: 8px; }
    input { padding: 10px; width: 300px; font-size: 16px; border-radius: 5px; border: 1px solid #555; }
  </style>
</head>
<body>
  <h1>Jarvis Remote Control</h1>
  <input type="text" id="speakText" placeholder="Say something..." />
  <button onclick="speak()">Speak</button>
  <br><br>
  <button onclick="sendCommand('start camera')">Start Camera</button>
  <button onclick="sendCommand('start gesture')">Start Gesture</button>
  <button onclick="sendCommand('shutdown')">Shutdown PC</button>

  <script>
    async function speak() {
      const text = document.getElementById("speakText").value;
      await fetch("/speak", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text })
      });
    }

    async function sendCommand(cmd) {
      await fetch("/command", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: cmd })
      });
    }
  </script>
</body>
</html>
